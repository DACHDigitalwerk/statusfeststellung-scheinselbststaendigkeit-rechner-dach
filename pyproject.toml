[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "statusfeststellung-scheinselbststaendigkeit-rechner-dach"
version = "1.0.0"
description = "DACH Statusfeststellung & Scheinselbstständigkeit Prüfer 2026 (§ 7a SGB IV, BAG, ASVG, AHVG)"
readme = "README.md"
authors = [{ name = "DACH Digitalwerk", email = "dach.digitalwerk@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dach-statusfeststellung = "statusfeststellung_dach.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
